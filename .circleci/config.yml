# Python CircleCI 2.0 configuration file
#
# Check https://circleci.com/docs/2.0/language-python/ for more details


version: 2
jobs:
  build:
    docker:
      - image: mcasl/circleci_pipegraph:0.0.5
        environment:
          - USERNAME: "mcasl"
          - DOC_REPO: "PipeGraph"
          - DOC_URL: ""
          - EMAIL: "manuel.castejon@gmail.com"
    working_directory: ~/PipeGraph
    steps:
      - checkout
      - restore_cache:
          keys:
            - v2-uv-{{ checksum "uv.lock" }}
            - v2-uv-

      - run:
          name: Install uv and project dependencies
          command: |
            pip install uv
            uv sync
      - save_cache:
          paths:
            - ~/.cache/uv
          key: v2-uv-{{ checksum "uv.lock" }}

      - run:
          name: Run unitary tests
          command: |
            mkdir test-reports
            uv run pytest --junitxml=test-reports/junit.xml
      - store_test_results:
            path: test-reports
      - store_artifacts:
            path: test-reports

  deploy:
    docker:
      - image: mcasl/circleci_pipegraph:0.0.5
        environment:
          - USERNAME: "mcasl"
          - DOC_REPO: "PipeGraph"
          - DOC_URL: ""
          - EMAIL: "manuel.castejon@gmail.com"
    working_directory: ~/PipeGraph
    steps:
      - checkout
      - restore_cache:
          keys:
            - v2-uv-{{ checksum "uv.lock" }}
            - v2-uv-

      - run:
          name: Install uv and project dependencies
          command: |
            pip install uv
            uv sync --group docs --group release
      - save_cache:
          paths:
            - ~/.cache/uv
          key: v2-uv-{{ checksum "uv.lock" }}


      - run:
          name: Verify Git Tag vs. Version
          command: |
            uv run python setup.py verify

      - run:
          name: Create package
          command: |
            uv run python setup.py sdist bdist_wheel

      - run:
          name: Twine upload
          command: |
            uv run twine upload -u $PYPI_USERNAME -p $PYPI_PASSWORD dist/*

      - run:
          name: Make HTML documentation
          command: |
            export PYTHONPATH=$PWD
            set -o pipefail && cd doc && uv run make html 2>&1 | tee ~/log.txt
            sudo cat ~/log.txt && if grep -q "Traceback (most recent call last):" ~/log.txt; then false; else true; fi

      - run:
          name: Push Documentation to Github Pages
          command: |
            ci_scripts/circleci/push_doc.sh doc/_build/html
      - store_artifacts:
          path: doc/_build/html
          destination: ~/log.txt

workflows:
  version: 2
  build_and_deploy:
    jobs:
      - build:
          filters:
            tags:
              only: /.*/
            branches:
              ignore: gh-pages
      - deploy:
          requires:
            - build
          filters:
            tags:
              only: /[0-9]+(\.[0-9]+)*/
            branches:
              ignore: /.*/


