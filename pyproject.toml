[project]
name = "pipegraph"
version = "0.3.4"
description = "PipeGraph extends the concept of Scikit-Learn's Pipeline tool"
readme = "README.rst"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
docs = [
    "numpydoc>=1.11.0",
    "pillow>=13.0.0",
    "sphinx>=9.1.1",
    "sphinx-gallery>=0.22.1",
    "sphinx-rtd-theme>=3.1.0",
]
release = [
    "setuptools>=84.2.1",
    "twine>=7.0.0",
    "wheel>=0.48.0",
]

[tool.uv]
# El paquete se sigue construyendo con setup.py (CI); uv solo gestiona el entorno.
package = false

[tool.pytest.ini_options]
testpaths = ["pipegraph/tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
